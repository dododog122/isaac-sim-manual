<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機器人場景建置與訓練手冊</title>
<style>
  :root{
    --bg:#faf9f6;
    --panel:#ffffff;
    --ink:#232323;
    --sub:#6e6a63;
    --line:#e4e0d8;
    --serif: "Times New Roman", "Songti TC", "Songti SC", "SimSun", "STSong", "Noto Serif CJK TC", serif;

    --blue:#eaf2f8;      --blue-ink:#2e5f7f;   --blue-line:#cfe0ec;
    --orange:#fbeee0;    --orange-ink:#9c5a1e; --orange-line:#efd9bf;
    --yellow:#fbf6df;    --yellow-ink:#8a7000; --yellow-line:#eee2ad;
    --pink:#fbebf0;      --pink-ink:#99406b;   --pink-line:#efd0dd;
    --gray:#f0efec;      --gray-ink:#55534d;   --gray-line:#dedad2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--serif);
    background:var(--bg);
    color:var(--ink);
    line-height:1.75;
    font-size:16px;
  }
  h1,h2,h3{font-weight:600; letter-spacing:0.01em;}
  a{color:inherit;}

  /* ---------- 頂部世界切換列 ---------- */
  .worldbar{
    display:flex;
    align-items:center;
    gap:0;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    padding:0 32px;
  }
  .brand{
    font-size:17px;
    font-weight:700;
    padding:16px 24px 16px 0;
    border-right:1px solid var(--line);
    margin-right:8px;
    white-space:nowrap;
  }
  .world-tab{
    padding:17px 20px;
    cursor:pointer;
    font-size:15px;
    color:var(--sub);
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .world-tab:hover{color:var(--ink);}
  .world-tab.active{color:var(--ink); font-weight:700;}

  /* ---------- Landing ---------- */
  .landing{
    max-width:1080px;
    margin:0 auto;
    padding:70px 32px 100px;
  }
  .landing-head{
    text-align:center;
    margin-bottom:56px;
  }
  .landing-head h1{
    font-size:34px;
    margin:0 0 14px;
  }
  .landing-head p{
    color:var(--sub);
    font-size:16px;
    max-width:560px;
    margin:0 auto;
  }
  .world-cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:26px;
  }
  @media (max-width:820px){ .world-cards{grid-template-columns:1fr;} }
  .world-card{
    border:1px solid var(--line);
    border-radius:4px;
    padding:34px 28px;
    cursor:pointer;
    background:var(--panel);
    transition:box-shadow .15s ease, transform .15s ease;
    position:relative;
    overflow:hidden;
  }
  .world-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:4px;
  }
  .world-card:hover{ box-shadow:0 10px 26px rgba(0,0,0,0.07); transform:translateY(-3px); }
  .world-card .num{
    font-size:13px;
    color:var(--sub);
    letter-spacing:0.12em;
    margin-bottom:14px;
  }
  .world-card h2{
    font-size:22px;
    margin:0 0 10px;
  }
  .world-card p{
    font-size:14.5px;
    color:var(--sub);
    margin:0 0 18px;
  }
  .world-card .enter{
    font-size:13.5px;
    font-weight:700;
  }

  /* ---------- 主體 layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:calc(100vh - 58px);
  }
  @media (max-width:860px){ .layout{grid-template-columns:1fr;} }

  .sidebar{
    border-right:1px solid var(--line);
    padding:26px 22px;
    background:var(--panel);
  }
  .world-title{
    font-size:19px;
    margin:0 0 4px;
  }
  .world-desc{
    font-size:13.5px;
    color:var(--sub);
    margin:0 0 22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .search-box{
    width:100%;
    padding:9px 13px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:var(--serif);
    font-size:14px;
    margin-bottom:20px;
    background:var(--bg);
  }
  .cat-group-label{
    font-size:12px;
    color:var(--sub);
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin:18px 0 8px;
  }
  .cat-group-label:first-of-type{margin-top:0;}
  .cat-btn{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    text-align:left;
    padding:10px 12px;
    border-radius:3px;
    border:none;
    background:transparent;
    cursor:pointer;
    font-family:var(--serif);
    font-size:14.5px;
    color:var(--ink);
    margin-bottom:2px;
  }
  .cat-btn:hover{background:var(--bg);}
  .cat-btn.active{background:var(--bg); font-weight:700;}
  .cat-btn .dot{ width:7px;height:7px;border-radius:50%; flex:0 0 auto; }
  .cat-count{ margin-left:auto; font-size:11.5px; color:var(--sub); font-weight:400; }

  .main{ padding:34px 46px 70px; max-width:920px; }

  .breadcrumb{
    font-size:13px;
    color:var(--sub);
    margin-bottom:18px;
  }
  .breadcrumb span.sep{ margin:0 6px; }
  .breadcrumb button{
    background:none;border:none;font-family:var(--serif);color:var(--blue-ink);cursor:pointer;font-size:13px;padding:0;
  }

  .topic-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px;
    margin-top:8px;
  }
  .topic-card{
    border:1px solid var(--line);
    border-radius:3px;
    padding:20px 20px;
    cursor:pointer;
    background:var(--panel);
    transition:box-shadow .12s ease;
  }
  .topic-card:hover{ box-shadow:0 6px 18px rgba(0,0,0,0.06); }
  .topic-card .step-num{
    font-size:12px;
    color:var(--sub);
    margin-bottom:8px;
    letter-spacing:0.08em;
  }
  .topic-card h3{
    margin:0 0 8px;
    font-size:16px;
  }
  .topic-card p{
    margin:0;
    font-size:13px;
    color:var(--sub);
  }

  .category-title{ font-size:24px; margin:0 0 6px; }
  .category-desc{ color:var(--sub); font-size:15px; margin:0 0 22px; }

  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.03em;
    padding:4px 11px;
    border-radius:2px;
    margin-bottom:14px;
  }

  .detail-panel{
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--panel);
    padding:38px 42px;
  }
  .detail-panel h2{ margin-top:0; font-size:25px; }
  .detail-panel .lede{
    font-size:15.5px;
    color:var(--sub);
    margin-bottom:26px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .step-list{ margin:0; padding-left:22px; }
  .step-list li{ margin-bottom:10px; font-size:15px; }
  .section-label{
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    margin:28px 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .section-label:first-of-type{ margin-top:0; }
  pre{
    background:#f6f4ef;
    border:1px solid var(--line);
    border-radius:3px;
    padding:16px 18px;
    overflow-x:auto;
    font-size:13px;
    line-height:1.6;
    font-family:"Courier New", monospace;
  }
  code{ font-family:"Courier New", monospace; }
  table{ width:100%; border-collapse:collapse; font-size:14px; margin:10px 0 6px; }
  th,td{ border:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top; }
  th{ background:var(--bg); font-weight:700; }
  .tip{
    border-left:3px solid var(--blue-ink);
    background:var(--blue);
    padding:14px 18px;
    font-size:14px;
    margin:16px 0;
  }
  .warn{
    border-left:3px solid var(--orange-ink);
    background:var(--orange);
    padding:14px 18px;
    font-size:14px;
    margin:16px 0;
  }
  .home-hint{ color:var(--sub); font-size:14px; margin-top:44px; }
  ::selection{ background:#d8e7f1; }
</style>
</head>
<body>

<div class="worldbar" id="worldbar"></div>
<div id="app"></div>

<iframe src="https://drive.google.com/file/d/1vctakFmPJmGuH5xBArbEcRVT4wvZXztO/preview" width="100%" height="400" allow="autoplay" style="border-radius:3px;border:1px solid var(--line);margin-top:10px;"></iframe>`

        },
        uv_params: {
          title: "UV 參數對照表",
          summary: "官方 OmniPBR UVs 分類完整參數",

        },
        material_manage: {
          title: "材質管理",
          summary: "快速定位、反向查詢、批次替換",
          content: `
<ul class="step-list">
<li><b>快速定位：</b>選取物件後，材質欄位旁箭頭或材質球圖示可跳轉至對應材質</li>

<li><b>材質替換：</b>選取欲替換材質設為目標，選取新材質設為來源，執行 Swap 後所有綁定舊材質的物件自動更新</li>

        },

<table>
<tr><th>範本</th><th>適合場景</th></tr>
<tr><td>OmniPBR</td><td>一般物體，最為泛用</td></tr>

</ol>

        },
        texture_script: {
          title: "批次貼圖腳本",
          summary: "物件數量多時的自動化處理",
          content: `
<pre><code>import omni.usd
from pxr import UsdShade, Sdf

stage = omni.usd.get_context().get_stage()

def apply_texture_material(target_prim_path, texture_path, material_name):
    material_path = f"/World/Looks/{material_name}"
    material = UsdShade.Material.Define(stage, material_path)
    shader = UsdShade.Shader.Define(stage, material_path + "/Shader")
    shader.CreateIdAttr("OmniPBR")
    shader.CreateInput("diffuse_texture", Sdf.ValueTypeNames.Asset).Set(texture_path)
    material.CreateSurfaceOutput().ConnectToSource(shader.ConnectableAPI(), "surface")
    target_prim = stage.GetPrimAtPath(target_prim_path)
    UsdShade.MaterialBindingAPI(target_prim).Bind(material)

apply_texture_material(

)</code></pre>`

<div class="tip"><b>實戰筆記：</b>Roughness Map 可以做出裂痕、刮痕這類表面細節效果——同一張圖案，貼在 Roughness 上是「改變反光分布」，貼在 Normal Map 上則是「真正改變光影明暗模擬凹凸雕刻感」，兩者效果不同、適合搭配同一張圖分別測試對比。</div>
<div class="section-label">教學示範影片</div>

<tr><th>參數</th><th>作用</th></tr>

</table>

let state = { world:null, cat:null };

function renderWorldbar(){
  const bar = document.getElementById('worldbar');
  let html = `<div class="brand" onclick="goHome()" style="cursor:pointer;">機器人場景建置與訓練手冊</div>`;
  Object.entries(WORLDS).forEach(([key,w])=>{
    html += `<div class="world-tab ${state.world===key?'active':''}" onclick="enterWorld('${key}')">${w.short}</div>`;
  });
  bar.innerHTML = html;
}

function goHome(){
  state = {world:null, cat:null};
  renderWorldbar();
  const app = document.getElementById('app');
  let html = `
    <div class="landing">
      <div class="landing-head">
        <h1>機器人場景建置與訓練手冊</h1>
        <p>選擇一個主題開始閱讀。各部分彼此獨立，可依需求直接進入對應內容。</p>
      </div>
      <div class="world-cards">
  `;
  Object.entries(WORLDS).forEach(([key,w], idx)=>{
    const c = colorMap[w.color];
    html += `
      <div class="world-card" style="border-color:${c.line}" onclick="enterWorld('${key}')">
        <div style="position:absolute;top:0;left:0;right:0;height:4px;background:${c.ink};"></div>
        <div class="num">0${idx+1}</div>
        <h2>${w.label}</h2>
        <p>${w.desc}</p>
        <div class="enter" style="color:${c.ink};">進入 →</div>
      </div>
    `;
  });
  html += `</div></div>`;
  app.innerHTML = html;
}

function enterWorld(key){
  state = {world:key, cat:null};
  renderWorldbar();
  renderWorldHome();
}

  renderSidebar('');
  const main = document.getElementById('mainArea');
  let html = `<h2 class="category-title">${w.label}</h2><p class="category-desc">${w.desc}</p><div class="topic-grid">`;
  Object.entries(w.categories).forEach(([ckey, cat])=>{
    const cc = colorMap[cat.color];
    html += `
      <div class="topic-card" style="border-color:${cc.line}" onclick="state.cat='${ckey}';renderSidebar('');renderCategory('${ckey}')">
        <h3>${cat.label}</h3>
        <p>${cat.desc}</p>
      </div>
    `;
  });
  html += `</div>`;
  main.innerHTML = html;
}

function buildLayout(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="layout">
      <div class="sidebar">
        <div class="world-title">${WORLDS[state.world].label}</div>
        <div class="world-desc">${WORLDS[state.world].desc}</div>
        <input class="search-box" id="searchBox" placeholder="搜尋關鍵字...">
        <div id="catList"></div>
      </div>
      <div class="main" id="mainArea"></div>
    </div>
  `;
  document.getElementById('searchBox').addEventListener('input', (e)=>{
    renderSidebar(e.target.value);
    handleSearch(e.target.value);
  });
}

function renderSidebar(filter){
  const w = WORLDS[state.world];
  const list = document.getElementById('catList');
  if(!list) return;
  list.innerHTML = '';
  Object.entries(w.categories).forEach(([key, cat])=>{
    const c = colorMap[cat.color];
    let visible = true;
    if(filter){
      const hay = (cat.label + Object.values(cat.topics).map(t=>t.title+t.summary).join(' ')).toLowerCase();
      visible = hay.includes(filter.toLowerCase());
    }
    if(!visible) return;
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (state.cat===key ? ' active' : '');
    btn.innerHTML = `<span class="dot" style="background:${c.ink}"></span>${cat.label}<span class="cat-count">${Object.keys(cat.topics).length}</span>`;
    btn.onclick = ()=>{ state.cat = key; renderSidebar(document.getElementById('searchBox').value); renderCategory(key); };
    list.appendChild(btn);
  });
}

function renderCategory(catKey){
  const w = WORLDS[state.world];
  const cat = w.categories[catKey];
  const c = colorMap[cat.color];
  const main = document.getElementById('mainArea');
  let html = `
    <div class="breadcrumb"><button onclick="renderWorldHome()">${w.label}</button><span class="sep">/</span>${cat.label}</div>
    <h2 class="category-title">${cat.label}</h2>
    <p class="category-desc">${cat.desc}</p>
    <div class="topic-grid">
  `;
  Object.entries(cat.topics).forEach(([tkey, topic], idx)=>{
    html += `
      <div class="topic-card" style="border-color:${c.line}" onclick="renderTopic('${catKey}','${tkey}')">
        <h3>${topic.title}</h3>
        <p>${topic.summary}</p>
      </div>
    `;
  });
  html += `</div>`;
  main.innerHTML = html;
}

function renderTopic(catKey, topicKey){
  state.cat = catKey;
  const w = WORLDS[state.world];
  renderSidebar(document.getElementById('searchBox') ? document.getElementById('searchBox').value : '');
  const cat = w.categories[catKey];
  const topic = cat.topics[topicKey];
  const c = colorMap[cat.color];
  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="breadcrumb">
      <button onclick="renderWorldHome()">${w.label}</button><span class="sep">/</span>
      <button onclick="renderCategory('${catKey}')">${cat.label}</button><span class="sep">/</span>
      ${topic.title}
    </div>
    <div class="detail-panel" style="border-color:${c.line}">
      <h2>${topic.title}</h2>
      <div class="lede">${topic.summary}</div>
      ${topic.content}
    </div>
  `;
}

function handleSearch(q){
  const w = WORLDS[state.world];
  const main = document.getElementById('mainArea');
  if(!q){ renderWorldHome(); return; }
  const query = q.toLowerCase();
  let html = `<h2 class="category-title">搜尋結果</h2><div class="topic-grid">`;
  let found = 0;
  Object.entries(w.categories).forEach(([ckey, cat])=>{
    const c = colorMap[cat.color];
    Object.entries(cat.topics).forEach(([tkey, topic])=>{
      const hay = (topic.title + topic.summary + cat.label).toLowerCase();
      if(hay.includes(query)){
        found++;
        html += `
          <div class="topic-card" style="border-color:${c.line}" onclick="renderTopic('${ckey}','${tkey}')">
            <h3>${topic.title}</h3>
            <p>${topic.summary}</p>
          </div>
        `;
      }
    });
  });
  if(found===0){ html += `<p class="category-desc">無符合結果。</p>`; }
  html += `</div>`;
  main.innerHTML = html;
}

goHome();
</script>
</body>
</html>
